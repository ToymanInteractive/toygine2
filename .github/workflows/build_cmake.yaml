name: CMake

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC x64
            os: windows-2025-vs2026
            run_benchmarks: "true"
            run_test: "true"
            cmake_preset: windows-msvc-x64
            artifact_id: windows-x64

          - name: Windows MSVC x86
            os: windows-2025-vs2026
            run_benchmarks: "true"
            run_test: "true"
            cmake_preset: windows-msvc-x86
            artifact_id: windows-x86

          - name: Windows MSVC Arm64
            os: windows-11-vs2026-arm
            run_benchmarks: "true"
            run_test: "true"
            cmake_preset: windows-msvc-arm64
            artifact_id: windows-arm64

          - name: macOS XCode arm64
            os: macos-26
            run_test: "true"
            cmake_preset: macos-xcode
            artifact_id: macos-xcode-arm64

          - name: macOS XCode Intel
            os: macos-26-intel
            run_test: "true"
            cmake_preset: macos-xcode
            artifact_id: macos-xcode-x64

          - name: macOS Ninja arm64
            os: macos-26
            run_benchmarks: "true"
            run_test: "true"
            cmake_preset: macos-release
            artifact_id: macos-ninja-arm64

          - name: macOS Ninja Intel
            os: macos-26-intel
            run_benchmarks: "true"
            run_test: "true"
            cmake_preset: macos-release
            artifact_id: macos-ninja-x64

          - name: Linux Ninja x64
            os: ubuntu-26.04
            run_benchmarks: "true"
            run_test: "true"
            cmake_preset: linux-release
            artifact_id: linux-x64

          - name: Linux Ninja arm64
            os: ubuntu-26.04-arm
            run_benchmarks: "true"
            run_test: "true"
            cmake_preset: linux-release
            artifact_id: linux-arm64

          - name: Sega Mega Drive
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.md.toolchain:latest
            run_test: "false"
            cmake_preset: md-release
            artifact_id: md

          - name: Nintendo GBA
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.gba.toolchain:latest
            run_test: "false"
            cmake_preset: gba-release
            artifact_id: gba

          - name: Nintendo DS
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.nds.toolchain:latest
            run_test: "false"
            cmake_preset: nds-release
            artifact_id: nds

          - name: Nintendo 3DS
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.3ds.toolchain:latest
            run_test: "false"
            cmake_preset: 3ds-release
            artifact_id: 3ds

          - name: Nintendo Switch
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.switch.toolchain:latest
            run_test: "false"
            cmake_preset: switch-release
            artifact_id: switch

          - name: Nintendo GameCube
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.gc.toolchain:latest
            run_test: "false"
            cmake_preset: gamecube-release
            artifact_id: gamecube

          - name: Nintendo Wii
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.wii.toolchain:latest
            run_test: "false"
            cmake_preset: wii-release
            artifact_id: wii

          - name: Nintendo Wii U
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.wiiu.toolchain:latest
            run_test: "false"
            cmake_preset: wii-u-release
            artifact_id: wii-u

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    container: ${{ matrix.container != '' && matrix.container || null }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare APT staging dir
        if: contains(matrix.os, 'ubuntu') && matrix.container == ''
        run: mkdir -p "$RUNNER_TEMP/apt-cache"

      - name: APT cache restore
        if: contains(matrix.os, 'ubuntu') && matrix.container == ''
        id: build-apt-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/apt-cache
          key: build-${{ matrix.os }}-apt-${{ matrix.cmake_preset }}
          restore-keys: |
            build-${{ matrix.os }}-apt-${{ matrix.cmake_preset }}

      - name: Prepare CI
        if: ${{ matrix.container == '' }}
        run: |
          if [[ "${{ matrix.os }}" =~ "windows" ]]; then
            MSVC_INSTALL_PATH=$(vswhere -latest -property installationPath)
            echo "MSVC_INSTALL_PATH = $MSVC_INSTALL_PATH"

            echo "Installed toolset versions:"
            ls -vr "$MSVC_INSTALL_PATH/VC/Tools/MSVC"

            TOOLS_DIR=$(ls -vr "$MSVC_INSTALL_PATH/VC/Tools/MSVC/" | head -1)
            echo "TOOLS_DIR = $TOOLS_DIR"

            DUMPBIN_PATH="$MSVC_INSTALL_PATH/VC/Tools/MSVC/$TOOLS_DIR/bin/Hostx64/x64/dumpbin.exe"
            echo "DUMPBIN_PATH = $DUMPBIN_PATH"
          elif [[ "${{ matrix.os }}" =~ "macos" ]]; then
            # Prefer the desired version if it exists, otherwise keep the default.
            if [ -d "/Applications/Xcode_26.6.0.app" ]; then
              sudo xcode-select -s /Applications/Xcode_26.6.0.app
            elif [ -d "/Applications/Xcode_26.5.0.app" ]; then
              sudo xcode-select -s /Applications/Xcode_26.5.0.app
            fi
          elif [[ "${{ matrix.os }}" =~ "ubuntu" ]]; then
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive

            APT_CACHE="${APT_CACHE:-${RUNNER_TEMP:-/tmp}/apt-cache}"
            sudo mkdir -p "$APT_CACHE"

            sudo apt -yq -o Acquire::Retries=3 update
            sudo apt -yq \
              -o Dir::Cache::archives="$APT_CACHE" \
              -o APT::Keep-Downloaded-Packages=true \
              -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 \
              install eatmydata

            sudo eatmydata apt -yq --no-install-recommends \
              -o Dir::Cache::archives="$APT_CACHE" \
              -o APT::Keep-Downloaded-Packages=true \
              -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 \
              install \
              gcc-16 g++-16

            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-16 100

            sudo rm -f  "$APT_CACHE/lock" || true
            sudo rm -rf "$APT_CACHE/partial" || true
            sudo chown -R "$USER:$USER" "$APT_CACHE"
          fi

      - name: APT cache save
        if: contains(matrix.os, 'ubuntu') && matrix.container == '' && steps.build-apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/apt-cache
          key: ${{ steps.build-apt-cache.outputs.cache-primary-key }}

      - name: Setup MSVC developer command prompt
        if: ${{ contains(matrix.cmake_preset, 'msvc') }}
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: ${{ contains(matrix.cmake_preset, 'arm64') && 'arm64' || contains(matrix.cmake_preset, 'x86') && 'x86' || 'x64' }}

      - name: Prepare artifact name
        if: ${{ matrix.artifact_id != '' && github.event_name == 'pull_request' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          echo "BUILD_FILE_NAME=${ARTIFACT_ID}-${HEAD_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          BENCHMARKS_ARG=""
          if [ "${{ matrix.run_benchmarks }}" = "true" ]; then
            BENCHMARKS_ARG="-DBENCHMARKS_OUTPUT_FILE=$GITHUB_WORKSPACE/benchmarks_bmf.json"
          fi
          cmake $BENCHMARKS_ARG --preset ${{ matrix.cmake_preset }}
          cmake --build --preset ${{ matrix.cmake_preset }}

      - name: Package
        if: ${{ matrix.artifact_id != '' && github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          cpack --preset ${{ matrix.cmake_preset }}

      - name: Upload runtime artifact
        if: ${{ matrix.artifact_id != '' && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ${{ github.workspace }}/out/package/${{ matrix.cmake_preset }}/*.zip
          retention-days: 7
          if-no-files-found: error
          archive: false

      - name: Unit testing
        run: |
          if [ "${{ matrix.run_test }}" = "true" ]; then
            ctest --preset ${{ matrix.cmake_preset }}
          fi

  unit-tests:
    name: Collect unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare APT staging dir
        run: mkdir -p "$RUNNER_TEMP/apt-cache"

      - name: APT cache restore
        id: unit-test-apt-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/apt-cache
          key: unit-tests-apt
          restore-keys: |
            unit-tests-apt

      - name: Prepare CI
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          APT_CACHE="${APT_CACHE:-${RUNNER_TEMP:-/tmp}/apt-cache}"
          sudo mkdir -p "$APT_CACHE"

          sudo apt -yq -o Acquire::Retries=3 update
          sudo apt -yq \
            -o Dir::Cache::archives="$APT_CACHE" \
            -o APT::Keep-Downloaded-Packages=true \
            -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 \
            install eatmydata

          sudo eatmydata apt -yq --no-install-recommends \
            -o Dir::Cache::archives="$APT_CACHE" \
            -o APT::Keep-Downloaded-Packages=true \
            -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 \
            install \
            lcov

          sudo rm -f  "$APT_CACHE/lock" || true
          sudo rm -rf "$APT_CACHE/partial" || true
          sudo chown -R "$USER:$USER" "$APT_CACHE"

      - name: APT cache save
        if: steps.unit-test-apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/apt-cache
          key: ${{ steps.unit-test-apt-cache.outputs.cache-primary-key }}

      - name: Configure
        run: |
          cmake -DTOYGINE_TESTS_ENABLE_COVERAGE=ON --preset linux-debug

      - name: Collect JUnit
        run: |
          cmake --build --preset linux-debug
          ctest --progress --verbose --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/junit/junit.xml" --preset linux-debug

      - name: Upload JUnit report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.0.0
        with:
          report_type: test_results
          files: ${{ github.workspace }}/out/junit/junit.xml
          disable_search: true
          flags: units
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Collect coverage
        run: |
          cmake --build --preset linux-debug --target unit_tests_coverage

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          disable_search: true
          files: out/build/linux-debug/unit_tests_coverage.info
          flags: units
          token: ${{ secrets.CODECOV_TOKEN }}

  sonar-cloud:
    name: SonarCloud Analyzer
    # This job should be run only for the original repo (either pushes or pull requests originating from the same repo), forks are not allowed.
    # Workflows initiated by Dependabot do not have access to repo secrets, so this job should not be run in this case.
    if: >-
      ${{
          github.repository == 'ToymanInteractive/toygine2'
          && ( github.event_name == 'push' || ( github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository ) )
          && github.actor != 'dependabot[bot]'
       }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Prepare APT staging dir
        run: mkdir -p "$RUNNER_TEMP/apt-cache"

      - name: APT cache restore
        id: sonar-cloud-apt-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/apt-cache
          key: sonar-cloud-apt
          restore-keys: |
            sonar-cloud-apt

      - name: Prepare CI
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          APT_CACHE="${APT_CACHE:-${RUNNER_TEMP:-/tmp}/apt-cache}"
          sudo mkdir -p "$APT_CACHE"

          sudo apt -yq -o Acquire::Retries=3 update
          sudo apt -yq \
            -o Dir::Cache::archives="$APT_CACHE" \
            -o APT::Keep-Downloaded-Packages=true \
            -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 \
            install eatmydata

          sudo eatmydata apt -yq --no-install-recommends \
            -o Dir::Cache::archives="$APT_CACHE" \
            -o APT::Keep-Downloaded-Packages=true \
            -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 \
            install \
            gcc-16 g++-16

          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-16 100

          sudo rm -f  "$APT_CACHE/lock" || true
          sudo rm -rf "$APT_CACHE/partial" || true
          sudo chown -R "$USER:$USER" "$APT_CACHE"

      - name: APT cache save
        if: steps.sonar-cloud-apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/apt-cache
          key: ${{ steps.sonar-cloud-apt-cache.outputs.cache-primary-key }}

      - name: Prepare compile_commands.json
        run: |
          cmake --preset linux-debug

      - uses: SonarSource/sonarqube-scan-action@v8.2.1
        with:
          args: >-
            -Dsonar.cfamily.compile-commands=out/build/linux-debug/compile_commands.json
            -Dsonar.cfamily.analysisCache.mode=fs
            -Dsonar.cfamily.analysisCache.path=.sonar-cfamily-cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
