name: CMake

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      CODECOV_TOKEN:
        required: true
      BENCHER_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: read
      pull-requests: write
      checks: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC x64
            os: windows-2025-vs2026
            run_test: "true"
            cmake_preset_group: windows-msvc-x64
            multi_config: "true"
            artifact_id: windows-x64

          - name: Windows MSVC x86
            os: windows-2025-vs2026
            run_test: "true"
            cmake_preset_group: windows-msvc-x86
            multi_config: "true"
            artifact_id: windows-x86

          - name: Windows MSVC Arm64
            os: windows-11-vs2026-arm
            run_test: "true"
            cmake_preset_group: windows-msvc-arm64
            multi_config: "true"
            artifact_id: windows-arm64

          - name: macOS XCode arm64
            os: macos-26
            cmake_preset_group: macos-xcode
            multi_config: "true"
            artifact_id: macos-xcode-arm64

          - name: macOS XCode Intel
            os: macos-26-intel
            run_test: "true"
            cmake_preset_group: macos-xcode
            multi_config: "true"
            artifact_id: macos-xcode-x64

          - name: macOS Ninja arm64
            os: macos-26
            run_test: "true"
            cmake_preset_group: macos
            artifact_id: macos-ninja-arm64

          - name: macOS Ninja Intel
            os: macos-26-intel
            run_test: "true"
            cmake_preset_group: macos
            artifact_id: macos-ninja-x64

          - name: Linux Ninja x64 GCC
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.gcc.toolchain:latest
            run_test: "true"
            cmake_preset_group: linux
            artifact_id: linux-x64-gcc

          - name: Linux Ninja arm64 GCC
            os: ubuntu-26.04-arm
            container: ghcr.io/toymaninteractive/toygine2.gcc.toolchain:latest
            run_test: "true"
            cmake_preset_group: linux
            artifact_id: linux-arm64-gcc

          - name: Linux Ninja x64 CLang
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.clang.toolchain:latest
            run_test: "true"
            cmake_preset_group: linux
            artifact_id: linux-x64-clang

          - name: Linux Ninja arm64 CLang
            os: ubuntu-26.04-arm
            container: ghcr.io/toymaninteractive/toygine2.clang.toolchain:latest
            run_test: "true"
            cmake_preset_group: linux
            artifact_id: linux-arm64-clang

          - name: Sega Mega Drive
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.md.toolchain:latest
            run_benchmarks: "true"
            run_test: "true"
            cmake_preset_group: md
            artifact_id: md

          - name: Nintendo GBA
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.gba.toolchain:latest
            run_benchmarks: "true"
            run_test: "true"
            cmake_preset_group: gba
            artifact_id: gba

          - name: Nintendo DS
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.nds.toolchain:latest
            run_test: "false"
            cmake_preset_group: nds
            artifact_id: nds

          - name: Nintendo 3DS
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.3ds.toolchain:latest
            run_test: "false"
            cmake_preset_group: 3ds
            artifact_id: 3ds

          - name: Nintendo Switch
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.switch.toolchain:latest
            run_test: "false"
            cmake_preset_group: switch
            artifact_id: switch

          - name: Nintendo GameCube
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.gc.toolchain:latest
            run_test: "false"
            cmake_preset_group: gamecube
            artifact_id: gamecube

          - name: Nintendo Wii
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.wii.toolchain:latest
            run_test: "false"
            cmake_preset_group: wii
            artifact_id: wii

          - name: Nintendo Wii U
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.wiiu.toolchain:latest
            run_test: "false"
            cmake_preset_group: wii-u
            artifact_id: wii-u

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    container: ${{ matrix.container != '' && matrix.container || null }}
    env:
      CMAKE_PRESET: ${{ matrix.multi_config == 'true' && matrix.cmake_preset_group || format('{0}-release', matrix.cmake_preset_group) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare CI
        if: ${{ matrix.container == '' }}
        run: |
          if [[ "${{ matrix.os }}" =~ "windows" ]]; then
            MSVC_INSTALL_PATH=$(vswhere -latest -property installationPath)
            echo "MSVC_INSTALL_PATH = $MSVC_INSTALL_PATH"

            echo "Installed toolset versions:"
            ls -vr "$MSVC_INSTALL_PATH/VC/Tools/MSVC"

            TOOLS_DIR=$(ls -vr "$MSVC_INSTALL_PATH/VC/Tools/MSVC/" | head -1)
            echo "TOOLS_DIR = $TOOLS_DIR"

            DUMPBIN_PATH="$MSVC_INSTALL_PATH/VC/Tools/MSVC/$TOOLS_DIR/bin/Hostx64/x64/dumpbin.exe"
            echo "DUMPBIN_PATH = $DUMPBIN_PATH"
          elif [[ "${{ matrix.os }}" =~ "macos" ]]; then
            # Prefer the desired version if it exists, otherwise keep the default.
            if [ -d "/Applications/Xcode_26.6.0.app" ]; then
              sudo xcode-select -s /Applications/Xcode_26.6.0.app
            elif [ -d "/Applications/Xcode_26.5.0.app" ]; then
              sudo xcode-select -s /Applications/Xcode_26.5.0.app
            fi
          fi

      - name: Setup MSVC developer command prompt
        if: ${{ contains(matrix.cmake_preset_group, 'msvc') }}
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: ${{ contains(matrix.cmake_preset_group, 'arm64') && 'arm64' || contains(matrix.cmake_preset_group, 'x86') && 'x86' || 'x64' }}

      - name: Prepare artifact name
        if: ${{ matrix.artifact_id != '' && github.event_name == 'pull_request' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail

          echo "BUILD_FILE_NAME=${ARTIFACT_ID}-${HEAD_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake --preset "$CMAKE_PRESET"
          cmake --build --preset "$CMAKE_PRESET"

      - name: Build engine lib debug
        run: |
          if [[ "${{ matrix.multi_config }}" == "true" ]]; then
            cmake --build --preset "$CMAKE_PRESET" --target toygine --config Debug
          else
            cmake --preset "${{ matrix.cmake_preset_group }}-debug"
            cmake --build --preset "${{ matrix.cmake_preset_group }}-debug" --target toygine
          fi

      - name: Build engine lib shipping
        run: |
          cmake --preset "${{ matrix.cmake_preset_group }}-shipping"
          cmake --build --preset "${{ matrix.cmake_preset_group }}-shipping"

      - name: Package
        if: ${{ matrix.artifact_id != '' && github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail

          cpack --preset "$CMAKE_PRESET"

          # Repacks the release archive with the debug and shipping engine libraries added to lib/.
          archives=("out/package/$CMAKE_PRESET"/*.zip)
          if [[ ${#archives[@]} -ne 1 || ! -f "${archives[0]}" ]]; then
            echo "Expected exactly one archive in out/package/$CMAKE_PRESET, found: ${archives[*]}" >&2
            exit 1
          fi
          archive_name=$(basename "${archives[0]}")
          top_dir="${archive_name%.zip}"
          repack_dir=out/package/repack

          rm -rf "$repack_dir"
          mkdir -p "$repack_dir"
          cmake -E chdir "$repack_dir" cmake -E tar xf "../$CMAKE_PRESET/$archive_name"

          debug_dir="out/build/${{ matrix.cmake_preset_group }}-debug"
          if [[ "${{ matrix.multi_config }}" == "true" ]]; then
            debug_dir="out/build/$CMAKE_PRESET"
          fi
          cmake --install "$debug_dir" --config Debug --component library --prefix "$repack_dir/$top_dir"
          cmake --install "out/build/${{ matrix.cmake_preset_group }}-shipping" --config Release --component library --prefix "$repack_dir/$top_dir"

          rm "${archives[0]}"
          cmake -E chdir "$repack_dir" cmake -E tar cf "../$CMAKE_PRESET/$archive_name" --format=zip "$top_dir"
          rm -rf "$repack_dir"

      - name: Upload runtime artifact
        if: ${{ matrix.artifact_id != '' && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ github.workspace }}/out/package/${{ env.CMAKE_PRESET }}/*.zip
          retention-days: 7
          if-no-files-found: error
          archive: false

      - name: Unit testing
        if: ${{ matrix.run_test == 'true' }}
        run: ctest --preset "$CMAKE_PRESET"

      - name: Benchmarks
        if: ${{ matrix.run_benchmarks == 'true' }}
        run: |
          cmake --preset "${{ matrix.cmake_preset_group }}-benchmarks"
          cmake --build --preset "${{ matrix.cmake_preset_group }}-benchmarks" --target toygine-benchmarks-run | tee benchmarks.log
          # Emulators exit with 0 even when the runner dies, so a log without '# done' is a failed run.
          grep -q '# done' benchmarks.log
          python3 tools/builder/bmf_from_csv.py benchmarks.log > benchmarks_bmf.json
          head -20 benchmarks_bmf.json

      - name: Install bencher CLI
        if: matrix.run_benchmarks == 'true'
        uses: bencherdev/bencher@v0.6.13

      - name: Upload benchmarks to bencher.dev
        if: matrix.run_benchmarks == 'true' && github.event_name != 'pull_request' && github.ref_name == 'main'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          bencher run \
            --project toygine2 \
            --key "$BENCHER_API_KEY" \
            --branch "${GITHUB_REF_NAME}" \
            --testbed "${{ matrix.artifact_id }}" \
            --threshold-measure latency \
            --threshold-test t_test \
            --threshold-max-sample-size 64 \
            --threshold-upper-boundary 0.99 \
            --thresholds-reset \
            --allow-failure \
            --adapter json \
            --file benchmarks_bmf.json

      - name: Upload benchmarks to bencher.dev (PR)
        if: >-
          ${{
              matrix.run_benchmarks == 'true'
              && github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]'
           }}
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BENCHER_TESTBED: ${{ matrix.artifact_id }}
        run: |
          # gba always reports to the PR; other testbeds comment only once an alert fires
          ci_flags=()
          if [[ "$BENCHER_TESTBED" != "gba" ]]; then
            ci_flags+=(--ci-only-on-alert)
          fi
          bencher run \
            --project toygine2 \
            --key "$BENCHER_API_KEY" \
            --branch "$GITHUB_HEAD_REF" \
            --start-point "$GITHUB_BASE_REF" \
            --start-point-hash "$BENCHER_BASE_SHA" \
            --start-point-clone-thresholds \
            --start-point-reset \
            --testbed "$BENCHER_TESTBED" \
            --adapter json \
            --file benchmarks_bmf.json \
            --github-actions "${{ secrets.GITHUB_TOKEN }}" \
            "${ci_flags[@]}"

  unit-tests:
    name: Collect unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: ghcr.io/toymaninteractive/toygine2.gcc.toolchain:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure
        run: |
          cmake -DTOYGINE_TESTS_ENABLE_COVERAGE=ON --preset linux-debug

      - name: Collect JUnit
        run: |
          cmake --build --preset linux-debug
          ctest --progress --verbose --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/junit/junit.xml" --preset linux-debug

      - name: Upload JUnit report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          report_type: test_results
          files: out/junit/junit.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Collect coverage
        run: |
          cmake --build --preset linux-debug --target unit_tests_coverage

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          disable_search: true
          files: out/build/linux-debug/unit_tests_coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}

  sonar-cloud:
    name: SonarCloud Analyzer
    # This job should be run only for the original repo (either pushes or pull requests originating from the same repo), forks are not allowed.
    # Workflows initiated by Dependabot do not have access to repo secrets, so this job should not be run in this case.
    if: >-
      ${{
          github.repository == 'ToymanInteractive/toygine2'
          && ( github.event_name == 'push' || ( github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository ) )
          && github.actor != 'dependabot[bot]'
       }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: ghcr.io/toymaninteractive/toygine2.gcc.toolchain:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Sonar C/C++ analysis cache restore
        id: sonar-cfamily-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .sonar-cfamily-cache
          key: sonar-cfamily-${{ github.event_name == 'pull_request' && format('PR-{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            sonar-cfamily-

      - name: Prepare compile_commands.json
        run: |
          cmake --preset linux-debug

      - uses: SonarSource/sonarqube-scan-action@v8.4.0
        with:
          args: >-
            -Dsonar.cfamily.compile-commands=out/build/linux-debug/compile_commands.json
            -Dsonar.cfamily.analysisCache.mode=fs
            -Dsonar.cfamily.analysisCache.path=.sonar-cfamily-cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Sonar C/C++ analysis cache save
        if: steps.sonar-cfamily-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .sonar-cfamily-cache
          key: ${{ steps.sonar-cfamily-cache.outputs.cache-primary-key }}
