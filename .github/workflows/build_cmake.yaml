name: CMake

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-2025
            run_benchmarks: "true"
            bencher_testbed: windows-x64
            run_test: "true"
            cmake_preset: windows-msvc

          - name: Windows MSVC x86
            os: windows-2025
            run_benchmarks: "true"
            bencher_testbed: windows-x86
            run_test: "true"
            cmake_preset: windows-msvc-x86

          - name: macOS XCode arm64
            os: macos-26
            run_test: "true"
            cmake_preset: macos-xcode

          - name: macOS XCode Intel
            os: macos-26-intel
            run_test: "true"
            cmake_preset: macos-xcode

          - name: macOS Ninja arm64
            os: macos-26
            run_benchmarks: "true"
            bencher_testbed: macos-arm64
            run_test: "true"
            cmake_preset: macos-release

          - name: macOS Ninja Intel
            os: macos-26-intel
            run_benchmarks: "true"
            bencher_testbed: macos-x64
            run_test: "true"
            cmake_preset: macos-release

          - name: Linux Ninja x64
            os: ubuntu-26.04
            run_benchmarks: "true"
            bencher_testbed: ubuntu-x64
            run_test: "true"
            cmake_preset: linux-release

          - name: Linux Ninja arm64
            os: ubuntu-26.04-arm
            run_benchmarks: "true"
            bencher_testbed: ubuntu-arm64
            run_test: "true"
            cmake_preset: linux-release

          - name: Nintendo GBA
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.gba.toolchain:latest
            run_test: "false"
            cmake_preset: gba-release

          - name: Nintendo DS
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.nds.toolchain:latest
            run_test: "false"
            cmake_preset: nds-release

          - name: Nintendo 3DS
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.3ds.toolchain:latest
            run_test: "false"
            cmake_preset: 3ds-release

          - name: Nintendo Switch
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.switch.toolchain:latest
            run_test: "false"
            cmake_preset: switch-release

          - name: Nintendo GameCube
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.gc.toolchain:latest
            run_test: "false"
            cmake_preset: gamecube-release

          - name: Nintendo Wii
            os: ubuntu-26.04
            container: ghcr.io/toymaninteractive/toygine2.wii.toolchain:latest
            run_test: "false"
            cmake_preset: wii-release

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    container: ${{ matrix.container != '' && matrix.container || null }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare APT staging dir
        if: contains(matrix.os, 'ubuntu') && matrix.container == ''
        run: mkdir -p "$RUNNER_TEMP/apt-cache"
