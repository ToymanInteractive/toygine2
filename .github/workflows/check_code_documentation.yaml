name: Check code documentation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  documentation:
    name: Check code documentation
    runs-on: ubuntu-26.04
    container: ghcr.io/toymaninteractive/toygine2.docs.toolchain:latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Generate Docs
        run: |
          cmake -DTOYGINE_BUILD_BENCHMARKS=OFF -DTOYGINE_BUILD_DOCS=ON -DTOYGINE_BUILD_EDITOR=OFF -DTOYGINE_BUILD_SAMPLES=OFF -DTOYGINE_BUILD_TESTS=OFF --preset linux-debug
          cmake --build --preset linux-debug --target docs
