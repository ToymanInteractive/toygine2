name: Check code style

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  style:
    name: Check code style
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container: ghcr.io/toymaninteractive/toygine2.clang.toolchain:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Get changed files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr view "${{ github.event.pull_request.number }}" \
            --json files --jq '.files[].path' > changed_files.txt

      - name: Check code format
        run: |
          bash tools/builder/check_code_format.sh changed_files.txt

      - name: Check code headers
        run: |
          bash tools/builder/check_source_headers.sh changed_files.txt

      - name: Check test conventions
        run: |
          bash tools/builder/check_test_conventions.sh

      - name: Check format of markdown files
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "**/*.md"
